# Refreshes tooling/debt/baseline in CI's environment and opens a PR with the result.
# Run it after a debt PR merges, or whenever the baseline should move.

name: Debt baseline

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the baseline moves (recorded in _meta.json)
        required: true
        default: refresh after merged debt work

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: debt-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Measure and record
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build bundles
        run: pnpm turbo run build --filter=@pr-review/cli --filter=@pr-review/mcp --filter=@pr-review/worker

      - name: Record baseline
        env:
          REASON: ${{ inputs.reason }}
        run: pnpm debt baseline --force "$REASON"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tooling/debt/baseline; then
            echo "baseline unchanged"
            exit 0
          fi
          branch="debt/baseline-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tooling/debt/baseline
          git commit -m "chore(debt): refresh baseline (${REASON})"
          git push -u origin "$branch"
          gh pr create --title "chore(debt): refresh baseline" --label tech-debt \
            --body "$(printf 'Regenerated by the Debt baseline workflow.\n\nReason: %s\n\nSee tooling/debt/.out/gate/report.md in the run summary for the deltas.' "$REASON")"
