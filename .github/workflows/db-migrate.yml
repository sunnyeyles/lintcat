# Applies pending Drizzle migrations to secrets.DATABASE_URL. production.yml
# calls it on every push to main, after CI and before the Vercel deploy.

name: Migrate database

on:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    # Two runs against one database must never overlap, and a queued one must not be dropped.
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require a database connection string
        env:
          # Only tested for emptiness, never printed.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret DATABASE_URL is not set. Add the Neon connection string under Settings > Secrets and variables > Actions > Secrets. Without it drizzle-kit would read an empty url and fail mid-run."
            exit 1
          fi
          echo "Connection string is configured."

      - name: Setup workspace
        uses: ./.github/actions/setup

      # drizzle-kit compares the journal against the database, so no pending migration is a no-op.
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
