# Resets the single shared Neon `preview` branch from main on every PR update.

name: Reset Neon preview branch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

# One shared branch: resets must run one at a time, and a newer PR update wins.
concurrency:
  group: neon-preview-reset
  cancel-in-progress: true

jobs:
  reset:
    name: Reset preview from main
    # Fork PRs get no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Reset preview branch
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: solitary-darkness-31270773
          branch: preview
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}
