# Reviews this repository's own pull requests with the action built from the branch.
# Opt-in via the `ai-review` label; with no key for the provider the action skips with a notice.

name: Self review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Deliberately read: `fix` stays off here, so verified fixes arrive as
# suggested changes. Turning it on needs `contents: write` and `fix: "true"`.
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    # Opt in per pull request: no label, no review, no spend. The second
    # clause stops an unrelated label from paying for a re-review.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ai-review')
      && (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      # A local action must have its dist/ built before `uses: ./` runs it;
      # dist/ is gitignored, so it is always built here rather than committed.
      - name: Build the action
        run: pnpm --filter @pr-review/action build

      - name: Review this pull request
        uses: ./apps/action
        # The action reads the selected provider's key from these, so the
        # workflow never has to pick one.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          # Repository variables, so provider and model change without a commit.
          model-provider: ${{ vars.MODEL_PROVIDER }}
          model: ${{ vars.REVIEW_MODEL }}
          # Optional: without these the action uses in-code prompts and no tracing.
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          # Keys are region-scoped: the wrong host 401s and drops every trace.
          langfuse-base-url: ${{ vars.LANGFUSE_BASE_URL }}
          # Optional: without both, the review is published to GitHub only.
          dashboard-url: ${{ vars.DASHBOARD_URL }}
          dashboard-token: ${{ secrets.DASHBOARD_TOKEN }}
