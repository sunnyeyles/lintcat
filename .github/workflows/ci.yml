name: CI

on:
  # Branches only: main runs this through production.yml.
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push supersedes a branch's run; main keeps every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # tsc and vitest never read the bundles; a bundling regression fails here, not at release.
      - name: Build bundles
        run: pnpm turbo run build --filter=@pr-review/cli --filter=@pr-review/mcp --filter=@pr-review/worker

      - name: Smoke-test cli and mcp bundles
        run: node scripts/smoke-cli-mcp.mjs

