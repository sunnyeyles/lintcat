name: CI

on:
  # Branches only: a tag runs this through release-action.yml, main through production.yml.
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-action-bundle:
        description: Upload the smoke-tested action bundle as the `action-dist` artifact.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a branch's run; main keeps every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # tsc and vitest never read the bundles; a bundling regression fails here, not at release.
      - name: Build bundles
        run: pnpm turbo run build --filter=@pr-review/action --filter=@pr-review/cli --filter=@pr-review/mcp

      # Must import under the declared Node major and stay inert without GITHUB_ACTIONS.
      - name: Smoke-test action bundle
        run: node scripts/smoke-bundle.mjs

      - name: Smoke-test cli and mcp bundles
        run: node scripts/smoke-cli-mcp.mjs

      - name: Upload action bundle
        if: inputs.upload-action-bundle
        uses: actions/upload-artifact@v7
        with:
          name: action-dist
          path: apps/action/dist/index.mjs
          if-no-files-found: error
          retention-days: 1
