# Publishes action.yml, dist/, README.md and LICENSE to vars.ACTION_RELEASE_REPO
# using secrets.ACTION_RELEASE_TOKEN, and moves that repo's major-version alias.

name: Release action

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v2.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-action
  cancel-in-progress: false

jobs:
  # Must pass before any checkout: an empty `repository:` or `token:` would make
  # actions/checkout target this repo and force-push release tags onto it.
  preflight:
    name: Check release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require a destination repository and a push token
        env:
          # The token is only tested for emptiness, never printed.
          RELEASE_REPO: ${{ vars.ACTION_RELEASE_REPO }}
          RELEASE_TOKEN: ${{ secrets.ACTION_RELEASE_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ok=true

          if [ -z "${RELEASE_REPO:-}" ]; then
            echo "::error::Repository variable ACTION_RELEASE_REPO is not set. Set it to the public action repository (owner/repo, e.g. sunnyeyles/pr-review-action) under Settings > Secrets and variables > Actions > Variables."
            ok=false
          elif [ "${RELEASE_REPO:-}" = "${SOURCE_REPO:-}" ]; then
            echo "::error::ACTION_RELEASE_REPO points at this repository (${SOURCE_REPO}). It must name the separate public action repository, otherwise the release would overwrite the source tree."
            ok=false
          elif ! printf '%s' "${RELEASE_REPO:-}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::ACTION_RELEASE_REPO must be in owner/repo form (got '${RELEASE_REPO}')."
            ok=false
          fi

          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::error::Secret ACTION_RELEASE_TOKEN is not set. Create a PAT or app token with contents:write on the destination repository and store it under Settings > Secrets and variables > Actions > Secrets. Without it the publish checkout would fall back to the default workflow token, which has no access to the destination."
            ok=false
          fi

          if [ "${ok}" != true ]; then
            echo "::error::Release aborted before any checkout: the publish destination is not configured."
            exit 1
          fi

          echo "Destination repository and push token are configured."

  # The one typecheck/test/build/smoke run for a tag push; ci.yml ignores tags.
  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      upload-action-bundle: true

  release:
    name: Publish
    runs-on: ubuntu-latest
    # Nothing here, not even the checkout, runs unless preflight passed.
    needs: [preflight, ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Exactly the bundle CI smoke-tested, not a rebuild.
      - name: Download action bundle
        uses: actions/download-artifact@v8
        with:
          name: action-dist
          path: apps/action/dist

      - name: Resolve release tag
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "::error::tag must start with v (got '$tag')"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"

      - name: Checkout the public action repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.ACTION_RELEASE_REPO }}
          token: ${{ secrets.ACTION_RELEASE_TOKEN }}
          path: .release
          fetch-depth: 0

      # Workflows pinned to the major alias get whatever it points at next.
      - name: Refuse to drop inputs under an existing major
        env:
          MAJOR: ${{ steps.tag.outputs.major }}
        run: |
          set -euo pipefail
          if ! git -C .release rev-parse -q --verify "refs/tags/${MAJOR}" >/dev/null; then
            echo "${MAJOR} is not published yet; no earlier inputs to keep."
            exit 0
          fi
          published="${RUNNER_TEMP}/published-action.yml"
          if ! git -C .release show "refs/tags/${MAJOR}:action.yml" > "$published"; then
            echo "::error::${MAJOR} exists on the release repository but has no action.yml to compare against."
            exit 1
          fi
          node scripts/check-action-inputs.mjs "$published" apps/action/action.yml "$MAJOR"

      # Replace, not merge, so a file deleted here disappears downstream too.
      - name: Stage the published tree
        run: |
          set -euo pipefail
          find .release -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p .release/dist
          cp apps/action/action.yml .release/action.yml
          cp apps/action/dist/index.mjs .release/dist/index.mjs
          cp apps/action/README.md .release/README.md
          # A missing LICENSE must fail the release; both READMEs promise one.
          cp LICENSE .release/LICENSE

      - name: Commit and tag
        working-directory: .release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MAJOR: ${{ steps.tag.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish for $TAG"
          else
            git commit -m "release: $TAG"
          fi
          git tag -f "$TAG"
          git tag -f "$MAJOR"
          git push origin HEAD:main
          git push origin -f "$TAG"
          git push origin -f "$MAJOR"

      # A tag alone gives no Releases entry and no Marketplace listing.
      # The first Marketplace publish is still a manual tick in that repo's UI.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.ACTION_RELEASE_TOKEN }}
          REPO: ${{ vars.ACTION_RELEASE_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
          MAJOR: ${{ steps.tag.outputs.major }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -euo pipefail
          notes="Built from ${SOURCE}.

          \`\`\`yaml
          - uses: ${REPO}@${MAJOR}
          \`\`\`"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes "$notes" --latest
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "$notes" --latest
          fi
