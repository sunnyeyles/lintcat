<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LintCat loader</title>
<style>
  body { margin: 0; background: #F5EFE3; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #1E2D42; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; padding: 48px; }
  .panel { display: flex; align-items: center; gap: 20px; }
  .dark { background: #1E2D42; padding: 24px; border-radius: 16px; }
  .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A93A3; }
</style>
</head>
<body>
  <div class="panel">
    <img src="lintcat-loader-colour.svg" width="96" height="96" alt="loading">
    <img src="lintcat-loader-colour.svg" width="32" height="32" alt="">
    <img src="lintcat-loader-colour.svg" width="16" height="16" alt="">
    <span class="label">colour</span>
  </div>
  <div class="panel dark">
    <img src="lintcat-loader-cream.svg" width="96" height="96" alt="loading">
    <img src="lintcat-loader-cream.svg" width="32" height="32" alt="">
    <span class="label">on dark</span>
  </div>
  <div class="panel">
    <img src="lintcat-loader-navy.svg" width="64" height="64" alt="loading">
    <span class="label">single colour</span>
  </div>
</body>
</html>
