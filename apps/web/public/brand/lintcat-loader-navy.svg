<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lc-look{animation:lc-look 2.4s step-end infinite}
    .lc-blink{transform-origin:50px 52px;animation:lc-blink 2.4s step-end infinite}
    .lc-whisk-l{animation:lc-whisk 1.2s step-end infinite}
    .lc-whisk-r{animation:lc-whisk 1.2s step-end infinite;animation-delay:-.6s}
    @keyframes lc-look{0%,12.5%{transform:translateX(-4px)}37.5%{transform:translateX(4px)}75%,87.5%{transform:none}}
    @keyframes lc-blink{0%,74.9%{transform:none}75%{transform:scaleY(.15)}87.5%,100%{transform:none}}
    @keyframes lc-whisk{0%{transform:none}50%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){.lc-look,.lc-blink,.lc-whisk-l,.lc-whisk-r{animation:none}}
  </style>

  
  <g fill="#1E2D42">
    <rect x="14" y="8" width="20" height="22"></rect>
    <rect x="66" y="8" width="20" height="22"></rect>
    <rect x="10" y="30" width="80" height="58"></rect>
  </g>
  <rect x="22" y="20" width="8" height="8" fill="#1E2D42"></rect>
  <rect x="70" y="20" width="8" height="8" fill="#1E2D42"></rect>
  <g class="lc-blink">
    <rect x="22" y="44" width="20" height="16" fill="#F5EFE3"></rect>
    <rect x="58" y="44" width="20" height="16" fill="#F5EFE3"></rect>
    <g class="lc-look">
      <rect x="30" y="48" width="8" height="10" fill="#F5EFE3"></rect>
      <rect x="62" y="48" width="8" height="10" fill="#F5EFE3"></rect>
    </g>
  </g>
  <rect x="44" y="68" width="12" height="8" fill="#1E2D42"></rect>
  <g class="lc-whisk-l"><rect x="4" y="62" width="10" height="6" fill="#1E2D42"></rect></g>
  <g class="lc-whisk-r"><rect x="86" y="62" width="10" height="6" fill="#1E2D42"></rect></g>
</svg>