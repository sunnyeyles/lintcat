name: Review Agent Fleet
description: >-
  Reviews a pull request with configurable agents.
author: sunnyeyles

branding:
  icon: check-circle
  color: purple

inputs:
  model-provider:
    description: >-
      Which model provider the review agents and Synthesiser call: `openai`
      or `anthropic`. An unknown name fails the step before any model call.
    required: false
    default: openai
  api-key:
    description: >-
      API key for the selected provider. Store it as a repository or
      organisation secret; never inline it. Defaults to the provider's
      conventional environment variable (OPENAI_API_KEY, ANTHROPIC_API_KEY)
      when left empty, so a workflow can pass the key through `env` instead.
    required: false
    default: ""
  github-token:
    description: >-
      Token used for the eight read-only repository tools, for the review
      comments, and for publishing the check run. The default workflow token
      is enough when the job grants contents: read, pull-requests: write, and
      checks: write — and contents: write when `fix` is on.
    required: false
    default: ${{ github.token }}
  fix:
    description: >-
      Whether verified fixes are committed to the pull request branch. Set to
      `true` to turn it on; any other value leaves it off. A fix is only ever
      committed when deterministic code has matched its replaced lines against
      the head commit character for character, at most 5 files and 200 lines
      per review. Requires contents: write. When this is off — and whenever the
      commit cannot be made, a fork's read-only token included — the same
      verified fixes are offered as suggested changes on the review comments
      instead, so nothing is lost by leaving it off.
    required: false
    default: "false"
  model:
    description: >-
      Default model id, as the selected provider spells it. An agent may
      override it with its own `model` in the agent configuration; the
      Synthesiser always uses this one. Leave empty for the provider's default
      (gpt-5.6-luna on openai, claude-haiku-4-5 on anthropic).
    required: false
    default: ""
  model-base-url:
    description: >-
      Overrides the provider's API host — point it at a gateway, a proxy, or
      any endpoint compatible with the selected provider's API (for openai,
      one that accepts max_completion_tokens). Leave empty to use the
      provider's own host.
    required: false
    default: ""
  agents:
    description: >-
      Which of the configured review agents run: `all`, or a comma-separated
      subset of their names. Each agent is an independent set of model calls,
      so narrowing the set cuts cost roughly in proportion — use it to iterate
      on one agent without paying for the others. A name the configuration
      does not define fails the step before any model call, rather than
      quietly running a narrower review. Naming agents also overrides their
      `paths`: the run is someone asking for those agents specifically, so a
      path filter does not then decide for them.
    required: false
    default: all
  agent-config:
    description: >-
      Repository-relative path to the YAML file naming this repository's
      review agents. It is read from the pull request's base commit over the
      API, never from the workspace, so a pull request cannot choose the
      agents that review it. Without this file the general agent reviews
      alone; create it to opt into the specialist agents. A malformed or empty
      one fails the step rather than running a review nobody configured.
    required: false
    default: .github/pr-review-agents.yml
  incremental:
    description: >-
      Whether a review reads only the commits added since this pull request was
      last reviewed, rather than its whole diff. Set to `true` to turn it on;
      any other value leaves it off. The baseline is the newest earlier commit
      carrying a completed `AI PR Review` check run, so nothing extra is
      stored; a first review, an unreadable one, or a force-push that leaves
      the baseline off the branch all fall back to reviewing the whole pull
      request. Findings an earlier review posted and nobody has resolved are
      listed on the check run, so a narrowed review never reads as a clean one.
    required: false
    default: "false"
  index:
    description: >-
      Whether the review builds a repository index before the agents start. On
      by default; set to `false` to turn it off. The index is one archive
      request for the repository's files at the pull request's base commit —
      never its head, so a branch cannot shape what the reviewer believes about
      the repository. From it the agents are told each changed file's role and
      its covering test. It is held in memory for the review and discarded;
      nothing is stored and no permission beyond contents: read is needed. A
      repository too large to archive, or any failure fetching or building it,
      is logged and the review runs exactly as it would without it.
    required: false
    default: "true"
  memory-branch:
    description: >-
      Branch this action stores its review memory on — one JSON file recording
      what this repository did with each past finding, so shapes it repeatedly
      ignores are deprioritised in later reviews. Leave empty, the default, and
      the feature is off: nothing is read and nothing is written. Setting it
      needs contents: write on the job, and a `closed` entry in the workflow's
      pull_request `types`, which is when the outcomes are recorded.
    required: false
    default: ""
  langfuse-public-key:
    description: >-
      Langfuse public key. Supply this and langfuse-secret-key to fetch the
      system prompts from Langfuse and export traces there. Leave both unset to
      run on the prompts built into this action, which is the default.
    required: false
    default: ""
  langfuse-secret-key:
    description: >-
      Langfuse secret key. Store it as a repository or organisation secret;
      never inline it.
    required: false
    default: ""
  langfuse-base-url:
    description: Langfuse host. Point this at your own instance if self-hosting.
    required: false
    default: https://cloud.langfuse.com
  langfuse-prompt-label:
    description: >-
      Label identifying which version of each prompt to fetch. Use this to try a
      prompt change on one repository before promoting it.
    required: false
    default: production
  dashboard-token:
    description: >-
      The organization's ingest secret for the review dashboard. Supply this and
      dashboard-url to record every review there. Store it as a repository or
      organisation secret; never inline it. Leave both unset and the review is
      published to GitHub only, which is the default.
    required: false
    default: ""
  dashboard-url:
    description: >-
      Base URL of the dashboard, such as https://example.vercel.app — the
      action appends `/api/ingest`. Setting only one of the two inputs records
      nothing and logs dashboard.disabled_incomplete_config.
    required: false
    default: ""

runs:
  using: node24
  main: dist/index.mjs
